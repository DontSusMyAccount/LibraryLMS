# Render Blueprint — LibraryLMS
# import: New > Blueprint > เลือก repo นี้ → Render สร้างทุกอย่างให้เอง
# services: web (Next.js :3000) + api (Elysia :3001) + Postgres

databases:
  - name: librarylms-db
    plan: free

services:
  # ── Web (Next.js frontend) ──────────────────────────────────────────────
  - type: web
    name: librarylms-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    plan: free
    healthCheckPath: /login
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: INTERNAL_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: librarylms-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # ── API (Elysia backend :3001) ──────────────────────────────────────────
  - type: web
    name: librarylms-api
    runtime: docker
    dockerfilePath: ./Dockerfile.server
    plan: free
    healthCheckPath: /health
    preDeployCommand: bun run db:extensions && bun run db:push && bun run db:seed
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: librarylms-db
          property: connectionString
      - key: AUTH_SECRET
        fromService:
          name: librarylms-web
          type: web
          envVarKey: AUTH_SECRET
      - key: INTERNAL_SECRET
        fromService:
          name: librarylms-web
          type: web
          envVarKey: INTERNAL_SECRET